name: Build Whyred Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev libncurses5-dev build-essential ccache \
          libelf-dev libudev-dev lzop curl wget zip git

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Clone ARM32 Toolchain (AOSP)
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 arm32

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export O=out
        make O=$O ARCH=$ARCH whyred_defconfig

        scripts/config --file $O/.config -e CONFIG_USER_NS
        scripts/config --file $O/.config -e CONFIG_NAMESPACES
        scripts/config --file $O/.config -e CONFIG_UIDGID_STRICT_TYPE_CHECKS
        scripts/config --file $O/.config -e CONFIG_DRM
        scripts/config --file $O/.config -e CONFIG_DRM_MSM

        make O=$O ARCH=$ARCH olddefconfig

    - name: Patch Kernel for Clang
      run: |
        # Fix current_stack_pointer
        sed -i '/register unsigned long current_stack_pointer asm ("sp");/c\
static inline unsigned long current_stack_pointer(void) {\
    unsigned long sp;\
    asm("mov %0, sp" : "=r"(sp));\
    return sp;\
}' arch/arm64/include/asm/stack_pointer.h

        # Fix spinlock constraint
        sed -i 's/"I" (1 << TICKET_SHIFT)/"n" (1 << TICKET_SHIFT)/' arch/arm64/include/asm/spinlock.h

    - name: Build Kernel with Proton Clang
      run: |
        export ARCH=arm64
        export O=out
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/arm32/bin/arm-linux-androideabi-

        # Remove ld symlink to avoid relr.dyn issue
        rm -f $GITHUB_WORKSPACE/clang/bin/ld

        make -j$(nproc) O=$O ARCH=$ARCH \
          CC=clang \
          HOSTCC=gcc \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          READELF=llvm-readelf \
          HOSTAR=llvm-ar

    - name: Clone AnyKernel3 & Pack ZIP
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Whyred-Kernel.zip *

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP
        path: Whyred-Kernel.zip
