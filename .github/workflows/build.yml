name: Build Whyred Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev \
          git build-essential ccache libelf-dev libudev-dev lzop curl wget zip

    - name: Install Neutron Clang via AntMan
      run: |
        curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
          -o antman && chmod +x antman
        mkdir clang && cd clang
        ../antman -S=latest
        cd ..

    - name: Configure Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        make O=out ARCH=arm64 whyred_defconfig

        # Aktifkan fitur tambahan
        scripts/config --file out/.config -e CONFIG_USER_NS
        scripts/config --file out/.config -e CONFIG_NAMESPACES
        scripts/config --file out/.config -e CONFIG_UIDGID_STRICT_TYPE_CHECKS
        scripts/config --file out/.config -e CONFIG_DRM
        scripts/config --file out/.config -e CONFIG_DRM_MSM

        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

    - name: Clone AnyKernel3 & Pack ZIP
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Whyred-Kernel.zip *

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Upload Flashable Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP
        path: Whyred-Kernel.zip
