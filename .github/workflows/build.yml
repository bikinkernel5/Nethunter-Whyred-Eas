name: Build RadKernel Whyred

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison \
          build-essential zip curl make libssl-dev bc libc6 unzip \
          libncurses5-dev libelf-dev

    - name: Clone Kernel Source (RadKernel)
      run: |
        git clone --depth=1 https://github.com/theradcolor/android_kernel_xiaomi_whyred.git kernel

    - name: Download AOSP Clang (r487747c)
      run: |
        wget -qO clang.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/r487747c/clang-r487747c.tar.gz || \
        wget -qO clang.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz
        tar xzf clang.tar.gz
        mv clang-r487747c clang

    - name: Clone ARM32 GCC Toolchain (AOSP 4.9)
      run: |
        git clone --depth=1 \
          https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 arm32

    - name: Set Build Env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=theradcolor" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=radkernel" >> $GITHUB_ENV
        echo "KBUILD_JOBS=$(nproc)" >> $GITHUB_ENV

    - name: Configure Kernel & Enable Features
      run: |
        cd kernel
        export ARCH=arm64 O=out
        make O=$O whyred_defconfig
        scripts/config --file $O/.config \
          -e CONFIG_USER_NS \
          -e CONFIG_PID_NS \
          -e CONFIG_NET_NS \
          -e CONFIG_UTS_NS \
          -e CONFIG_IPC_NS \
          -e CONFIG_NAMESPACES \
          -e CONFIG_UIDGID_STRICT_TYPE_CHECKS \
          -e CONFIG_DRM \
          -e CONFIG_DRM_MSM \
          -e CONFIG_DRM_KMS_HELPER \
          -e CONFIG_FB \
          -e CONFIG_FB_SIMPLE \
          -e CONFIG_DRM_PANEL_SIMPLE
        make O=$O olddefconfig

    - name: Build Kernel with Clang AOSP
      run: |
        cd kernel
        export ARCH=arm64 SUBARCH=arm64 O=out
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/arm32/bin/arm-linux-androideabi-
        make -j$(nproc) O=$O \
          CC=clang \
          HOSTCC=clang \
          AR=llvm-ar NM=llvm-nm \
          OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
          STRIP=llvm-strip READELF=llvm-readelf \
          HOSTAR=llvm-ar

    - name: Pack Flashable ZIP
      run: |
        cd kernel
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Whyred-RadKernel.zip *

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: kernel/out/arch/arm64/boot/Image.gz-dtb

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: RadKernel-ZIP
        path: kernel/Whyred-RadKernel.zip
