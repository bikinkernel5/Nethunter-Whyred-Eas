name: Build Whyred Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev libncurses5-dev build-essential ccache \
          libelf-dev libudev-dev lzop curl wget zip git

    - name: Clone Proton Clang
      run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Clone ARM32 Android Toolchain
      run: git clone --depth=1 https://github.com/arter97/arm32-gcc.git arm32

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export O=out
        make O=$O ARCH=$ARCH whyred_defconfig

        # Enable key kernel features
        scripts/config --file $O/.config -e CONFIG_USER_NS
        scripts/config --file $O/.config -e CONFIG_NAMESPACES
        scripts/config --file $O/.config -e CONFIG_UIDGID_STRICT_TYPE_CHECKS
        scripts/config --file $O/.config -e CONFIG_DRM
        scripts/config --file $O/.config -e CONFIG_DRM_MSM
        scripts/config --file $O/.config -e CONFIG_TMPFS
        scripts/config --file $O/.config -e CONFIG_SHMEM
        scripts/config --file $O/.config -e CONFIG_ANDROID_PARANOID_NETWORK
        scripts/config --file $O/.config -e CONFIG_PID_NS
        scripts/config --file $O/.config -e CONFIG_NET_NS
        scripts/config --file $O/.config -e CONFIG_UTS_NS
        scripts/config --file $O/.config -e CONFIG_CGROUPS
        scripts/config --file $O/.config -e CONFIG_IPC_NS
        scripts/config --file $O/.config -e CONFIG_FB
        make O=$O ARCH=$ARCH olddefconfig

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export O=out
        export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/arm32/bin:$PATH

        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-

        make -j$(nproc) O=$O ARCH=$ARCH \
          CC=clang \
          HOSTCC=gcc \
          LD=ld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          READELF=llvm-readelf \
          HOSTAR=llvm-ar

    - name: Clone AnyKernel3 & Pack ZIP
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Whyred-Kernel.zip *

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP
        path: Whyred-Kernel.zip

    - name: Upload Kernel Config
      run: |
        cp out/.config config.gz
        gzip -f config.gz
      continue-on-error: true

    - name: Upload Kernel Config Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Config
        path: config.gz
