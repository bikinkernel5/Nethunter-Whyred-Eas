name: Build Nethunter Kernel Whyred (Clang Compatible)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git ccache automake flex lzop bison \
          build-essential zip curl make libssl-dev bc \
          libc6 unzip libncurses5-dev libelf-dev binutils

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/Team-420/Nethunter-Whyred-Eas kernel

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Clone ARM32 GCC Toolchain (AOSP 4.9)
      run: |
        git clone --depth=1 \
          https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 arm32

    - name: Patch kernel source (Clang compatibility)
      run: |
        cd kernel

        # Fix register sp
        sed -i '/register unsigned long current_stack_pointer asm ("sp");/c\
static inline unsigned long current_stack_pointer(void) {\
    unsigned long sp;\
    asm("mov %0, sp" : "=r"(sp));\
    return sp;\
}' arch/arm64/include/asm/stack_pointer.h

        # Fix spinlock constraint
        sed -i 's/"I" (1 << TICKET_SHIFT)/"n" (1 << TICKET_SHIFT)/' arch/arm64/include/asm/spinlock.h

    - name: Set environment variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=nethunter" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=github" >> $GITHUB_ENV
        echo "KBUILD_JOBS=$(nproc)" >> $GITHUB_ENV

    - name: Configure kernel and enable features
      run: |
        cd kernel
        export ARCH=arm64
        export O=out
        make O=$O whyred_defconfig

        scripts/config --file $O/.config \
          -e CONFIG_USER_NS \
          -e CONFIG_PID_NS \
          -e CONFIG_NET_NS \
          -e CONFIG_UTS_NS \
          -e CONFIG_IPC_NS \
          -e CONFIG_NAMESPACES \
          -e CONFIG_UIDGID_STRICT_TYPE_CHECKS \
          -e CONFIG_DRM \
          -e CONFIG_DRM_MSM \
          -e CONFIG_DRM_KMS_HELPER \
          -e CONFIG_FB \
          -e CONFIG_FB_SIMPLE \
          -e CONFIG_DRM_PANEL_SIMPLE

        make O=$O olddefconfig

    - name: Build kernel with Clang
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export O=out
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export LLVM=1
        export LLVM_IAS=1
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/arm32/bin/arm-linux-androideabi-

        # Fix for .relr.dyn error
        rm -f $GITHUB_WORKSPACE/clang/bin/ld

        make -j$(nproc) O=$O \
          CC=clang HOSTCC=clang \
          LD=ld.lld \
          AR=llvm-ar NM=llvm-nm \
          OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
          STRIP=llvm-strip READELF=llvm-readelf \
          HOSTAR=llvm-ar

    - name: Pack kernel into ZIP with AnyKernel3
      run: |
        cd kernel
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Whyred-NHKernel.zip *

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: kernel/out/arch/arm64/boot/Image.gz-dtb

    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP
        path: kernel/Whyred-NHKernel.zip
